name: Docker build and push

on:
  push:
    branches:
      - production
      - developer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose image tag
        id: image
        run: |
          case "$GITHUB_REF_NAME" in
            production) echo "tag=stable" >> "$GITHUB_OUTPUT" ;;
            developer) echo "tag=developer" >> "$GITHUB_OUTPUT" ;;
            *) echo "Ref $GITHUB_REF_NAME does not publish an image." >&2; exit 1 ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/systemyakademickie-uam/system-backend:${{ steps.image.outputs.tag }}
