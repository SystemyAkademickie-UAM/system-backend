services:
  api:
    build: .
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: host.docker.internal
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:13.16-alpine
    environment:
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=maq_dev
    ports:
      - "24680:5432"
    volumes:
      - ./test_db.sql:/docker-entrypoint-initdb.d/test_db.sql
      # Zachowanie danych w bazie po wyłączeniu kontenerów
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d maq_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
