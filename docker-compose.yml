services:
  api:
    container_name: academy-api
    build: .
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../secrets:/app/secrets:ro
    networks:
      - academy-network

  db:
    container_name: academy-db
    image: postgres:13.16-alpine
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - ./maq.sql:/docker-entrypoint-initdb.d/maq.sql
      # Zachowanie danych w bazie po wyłączeniu kontenerów
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - academy-network

  idp:
    image: kenchan0130/simplesamlphp
    container_name: academy-idp
    ports:
      - "5000:8080"
    env_file:
      - .env
    volumes:
      - ./idp/apache/maq-idp.conf:/etc/apache2/conf-enabled/zz-maq-idp.conf:ro
      - ./idp/authsources.php:/var/www/simplesamlphp/config/authsources.php
      - ./idp/saml20-sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php
      - ./idp/lib:/var/www/simplesamlphp/config/maq-idp/lib
      - ./idp/data:/var/www/simplesamlphp/config/maq-idp/data
      - ./idp/www/maq-idp-users:/var/www/simplesamlphp/www/maq-idp-users
      - ./idp/modules/maqidp:/var/www/simplesamlphp/modules/maqidp
    networks:
      - academy-network

volumes:
  pg_data:

networks:
  academy-network:
    external: true
