services:
  backend:
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=dev_user
      - DATABASE_PASSWORD=dev_password
      - DATABASE_NAME=maq_dev
    depends_on:
      - db

  db:
    image: postgres:13.16-alpine
    environment:
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=maq_dev
    ports:
      - "5433:5432"
    volumes:
      - ./test_db.sql:/docker-entrypoint-initdb.d/test_db.sql
      # Zachowanie danych w bazie po wyłączeniu kontenerów
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
