services:
  api:
    container_name: academy-api
    build: .
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - academy-network

  db:
    image: postgres:13.16-alpine
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "24680:5432"
    volumes:
      - ./db_v2.sql:/docker-entrypoint-initdb.d/db_v2.sql
      # Zachowanie danych w bazie po wyłączeniu kontenerów
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - academy-network

volumes:
  pg_data:

networks:
  academy-network:
    external: true
